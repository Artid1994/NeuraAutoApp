name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      # Provides dependency/build caching. The build itself uses the committed
      # wrapper so CI runs the exact Gradle version pinned in
      # gradle/wrapper/gradle-wrapper.properties (8.4), matching local builds.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: NeuraAuto-AI-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: warn

      # Room writes the exported schema JSON here during kspDebugKotlin. It runs
      # even when a later task fails, and the files are needed as the baseline
      # for the next auto-migration — the v2 schema was lost this way once, so
      # it is now published on every run.
      - name: Upload Room schemas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: NeuraAuto-Room-Schemas
          path: app/schemas
          if-no-files-found: warn
