# ── Project-wide Gradle settings ─────────────────────────────────────────────
# REQUIRED: this project depends on AndroidX (core-ktx, lifecycle, activity,
# compose, work). Without these two flags AGP fails at :app:checkDebugAarMetadata
# with "Configuration ':app:debugRuntimeClasspath' contains AndroidX dependencies,
# but the 'android.useAndroidX' property is not enabled".
android.useAndroidX=true
android.enableJetifier=false

# Kotlin code style
kotlin.code.style=official

# Non-transitive R classes: smaller, faster builds (AGP 8 default behaviour)
android.nonTransitiveRClass=true

# ── JVM / daemon tuning for CI runners ───────────────────────────────────────
# The Android resource + DEX pipeline is memory hungry; the default 512m heap
# causes OOM on GitHub-hosted runners.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.daemon=true

# Fail fast on warnings that indicate broken configuration
android.defaults.buildfeatures.buildconfig=false

# This project deliberately targets Android 15 (API 35). AGP 8.2.2 predates
# official API 35 support, so it emits an "unsupported compileSdk" warning;
# the build itself is verified working. Suppress only the warning.
android.suppressUnsupportedCompileSdk=35
